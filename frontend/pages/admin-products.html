<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products CRUD - OneClick</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    th { font-family: var(--font-headings); font-weight: 600; color: var(--text-muted); }
    /* Modal container */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1.5rem; backdrop-filter: blur(5px); }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; width: 100%; max-width: 600px; padding: 2rem; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <header></header>

  <main class="container dashboard-layout" style="min-height: 75vh;">
    
    <div id="admin-sidebar-container"></div>

    <div class="dashboard-content">
      
      <div class="dashboard-card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div>
          <h2 style="font-size: 1.5rem;"><i class="fa-solid fa-boxes-packing"></i> Product Inventory</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Add, edit, or delete items from the store inventory database.</p>
        </div>
        <button class="btn btn-primary" onclick="openAddProductModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
      </div>

      <!-- Products Inventory Table -->
      <div class="dashboard-card" style="padding: 1.5rem;">
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-table">
              <tr>
                <td colspan="7" class="skeleton" style="height: 50px;"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <!-- CRUD Edit / Create Modal -->
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
        <h3 id="product-modal-title" style="font-size: 1.25rem;">Add Product</h3>
        <button onclick="document.getElementById('product-modal').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; font-size:1.25rem;"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="form-product-crud">
        <input type="hidden" id="prod-id" />
        
        <div class="form-group">
          <label class="form-label" for="prod-name">Product Name</label>
          <input type="text" class="form-control" id="prod-name" required />
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label" for="prod-category">Category</label>
            <select class="form-control" id="prod-category">
              <!-- Dynamically populated categories -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-price">Base Price (₹)</label>
            <input type="number" class="form-control" id="prod-price" min="0" step="0.01" required />
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label" for="prod-discount">Discount (%)</label>
            <input type="number" class="form-control" id="prod-discount" min="0" max="100" step="0.1" value="0" />
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-stock">Stock Units</label>
            <input type="number" class="form-control" id="prod-stock" min="0" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="prod-image">Image URL</label>
          <input type="url" class="form-control" id="prod-image" placeholder="https://unsplash.com/..." />
        </div>

        <div class="form-group">
          <label class="form-label" for="prod-desc">Product Description</label>
          <textarea class="form-control" id="prod-desc" rows="4" placeholder="Features, dimensions, warranty, details..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; height:45px;">
          Save Product
        </button>
      </form>
    </div>
  </div>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
