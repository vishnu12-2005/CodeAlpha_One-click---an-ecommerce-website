<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - OneClick</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header></header>

  <main class="container" style="margin-top: 3rem; min-height: 75vh;">
    
    <h2 style="font-size: 1.8rem; margin-bottom: 2rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;"><i class="fa-solid fa-credit-card"></i> Order Checkout</h2>

    <div class="cart-grid">
      
      <!-- Checkout Form panel -->
      <section style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:1rem; padding:2rem;">
        <form id="form-checkout">
          <h3 style="font-size:1.25rem; margin-bottom:1.5rem; color:var(--primary);"><i class="fa-solid fa-truck-ramp-box"></i> Shipping Details</h3>
          
          <div class="form-group">
            <label class="form-label" for="checkout-address">Delivery Address</label>
            <textarea class="form-control" id="checkout-address" rows="4" placeholder="Enter your full street address, apartment, city, state, zip code..." required></textarea>
          </div>

          <h3 style="font-size:1.25rem; margin-top:2rem; margin-bottom:1.5rem; color:var(--primary);"><i class="fa-solid fa-wallet"></i> Payment Method</h3>
          
          <div style="display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem;">
            <!-- COD -->
            <label style="background:var(--bg-main); border:1px solid var(--border-color); padding:1rem; border-radius:0.5rem; display:flex; align-items:center; gap:0.75rem; cursor:pointer;">
              <input type="radio" name="payment_method" value="COD" checked style="width:18px; height:18px;" />
              <div>
                <strong style="display:block; font-size:0.95rem;">Cash on Delivery (COD)</strong>
                <span style="font-size:0.8rem; color:var(--text-muted);">Pay with cash upon package receipt.</span>
              </div>
            </label>
            
            <!-- Online Payment -->
            <label style="background:var(--bg-main); border:1px solid var(--border-color); padding:1rem; border-radius:0.5rem; display:flex; align-items:center; gap:0.75rem; cursor:pointer;">
              <input type="radio" name="payment_method" value="Online" style="width:18px; height:18px;" />
              <div>
                <strong style="display:block; font-size:0.95rem;">Online Payment (Credit/Debit/UPI)</strong>
                <span style="font-size:0.8rem; color:var(--text-muted);">Mock gateway architecture prepared for Razorpay & Stripe integration.</span>
              </div>
            </label>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; height:48px; font-size:1.05rem;">
            Place Order
          </button>
        </form>
      </section>

      <!-- Cart totals review -->
      <aside style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:1rem; padding:2rem; display:flex; flex-direction:column; gap:1.5rem;">
        <h3 style="font-size:1.2rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">Order Summary</h3>
        
        <!-- List of items -->
        <div id="checkout-items-summary" style="max-height: 250px; overflow-y: auto;">
          <div class="skeleton" style="height:30px; margin-bottom:0.5rem;"></div>
          <div class="skeleton" style="height:30px;"></div>
        </div>

        <div style="border-top:1px solid var(--border-color); padding-top:1rem; display:flex; flex-direction:column; gap:0.75rem;">
          <!-- Subtotal -->
          <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
            <span style="color:var(--text-muted);">Subtotal</span>
            <span id="checkout-subtotal">₹0.00</span>
          </div>

          <!-- Coupon code -->
          <div style="display:none; justify-content:space-between; font-size:0.9rem; color:var(--success);" id="checkout-coupon-row">
            <span>Discount Applied</span>
            <span id="checkout-coupon-val">-₹0.00</span>
          </div>

          <!-- Shipping -->
          <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
            <span style="color:var(--text-muted);">Shipping Fees</span>
            <span style="color:var(--success);">FREE</span>
          </div>

          <!-- Grand Total -->
          <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:700; border-top:1px dashed var(--border-color); padding-top:1rem;">
            <span>Total Payable</span>
            <span id="checkout-total" style="color:var(--primary);">₹0.00</span>
          </div>
        </div>
      </aside>

    </div>

  </main>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
