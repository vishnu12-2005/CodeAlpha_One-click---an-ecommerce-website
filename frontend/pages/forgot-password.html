<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - OneClick</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Reset Password</h2>
        <p>Enter your email and we'll simulate sending reset instructions.</p>
      </div>

      <form id="form-forgot">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email Address</label>
          <input type="email" class="form-control" id="forgot-email" placeholder="name@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">
          Get Reset Link
        </button>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="/pages/login.html">Login</a></p>
      </div>
    </div>
  </main>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
