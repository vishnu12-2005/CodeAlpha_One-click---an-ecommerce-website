<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - OneClick</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header></header>

  <main class="container dashboard-layout" style="min-height: 75vh;">
    
    <div id="user-sidebar-container"></div>

    <div class="dashboard-content">
      
      <!-- Timeline Card -->
      <div class="dashboard-card" style="position:relative;">
        <h2 style="font-size: 1.4rem; margin-bottom: 2rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
          <i class="fa-solid fa-map-location-dot"></i> Track Shipment: Order <span id="track-order-id" style="color:var(--primary);">#</span>
        </h2>
        
        <!-- Steps Progress Bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem; padding:1.5rem 0; background:rgba(30,41,59,0.5); border-radius:1rem; border:1px solid var(--border-color); flex-wrap:nowrap; gap:1rem;" id="track-timeline-steps">
          <!-- Loaded dynamically via dashboard.js -->
          <div class="skeleton" style="width:100%; height:40px;"></div>
        </div>
      </div>

      <!-- Details Summary Card -->
      <div class="dashboard-card" id="track-items-summary">
        <!-- Loaded dynamically via dashboard.js -->
        <div class="skeleton" style="height:150px;"></div>
      </div>

    </div>

  </main>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
