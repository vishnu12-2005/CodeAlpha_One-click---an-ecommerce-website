<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - OneClick</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header></header>

  <main class="container" style="margin-top: 3rem; min-height: 80vh;">
    <!-- Main Details Box -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(350px, 1fr)); gap:3rem; background:var(--bg-card); border:1px solid var(--border-color); border-radius:1.5rem; padding:3rem; box-shadow:var(--shadow-lg);">
      
      <!-- Product Image -->
      <div>
        <img id="details-img" src="https://via.placeholder.com/500x500?text=Loading..." style="border-radius:1rem; width:100%; object-fit:cover; box-shadow:var(--shadow-md);" />
      </div>

      <!-- Product Meta -->
      <div style="display:flex; flex-direction:column; justify-content:space-between;">
        <div>
          <span id="details-category" style="font-size:0.8rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Electronics</span>
          <h1 id="details-name" style="font-size:2.2rem; margin-top:0.25rem; margin-bottom:1rem; line-height:1.2;">Product Name</h1>
          
          <div id="details-stock-status" style="margin-bottom:1.5rem;">
            <!-- Stock Status Badge -->
          </div>

          <div id="details-price-box" style="margin-bottom:1.5rem;">
            <!-- Prices and Discount -->
          </div>

          <p id="details-desc" style="color:var(--text-muted); line-height:1.6; margin-bottom:2rem;">
            Detailed product description loading...
          </p>
        </div>

        <div>
          <!-- Cart Actions -->
          <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
            <div style="display:flex; flex-direction:column; gap:0.25rem;">
              <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">Quantity</span>
              <input type="number" id="details-qty" class="form-control" value="1" min="1" max="100" style="width:80px; padding:0.5rem;" />
            </div>
            
            <button class="btn btn-primary" id="btn-details-addcart" style="flex:1; margin-top:auto; height:45px;">
              <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
            
            <button class="btn btn-secondary" id="btn-details-wishlist" style="margin-top:auto; height:45px; width:45px; padding:0;" title="Save to Wishlist">
              <i class="fa-solid fa-heart"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reviews Section -->
    <section style="margin-top: 4rem; display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:start;">
      
      <!-- List of reviews -->
      <div>
        <h2 style="font-size:1.5rem; margin-bottom:2rem; position:relative;">Customer Reviews</h2>
        <div id="details-reviews-list">
          <!-- Loaded dynamically via shop.js -->
          <div class="skeleton" style="height:100px; margin-bottom:1rem;"></div>
          <div class="skeleton" style="height:100px;"></div>
        </div>
      </div>

      <!-- Write review (Only verified buyers) -->
      <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:1rem; padding:2rem;">
        <h3 style="font-size:1.25rem; margin-bottom:1.5rem;">Write a Product Review</h3>
        <form id="form-submit-review">
          <div class="form-group">
            <label class="form-label" for="review-rating">Rating</label>
            <select class="form-control" id="review-rating" required>
              <option value="5">5 Stars - Excellent</option>
              <option value="4">4 Stars - Very Good</option>
              <option value="3">3 Stars - Good</option>
              <option value="2">2 Stars - Fair</option>
              <option value="1">1 Star - Poor</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="review-comment">Review Description</label>
            <textarea class="form-control" id="review-comment" rows="4" placeholder="Tell us your experience with this product..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Submit Review</button>
        </form>
        <p style="font-size:0.75rem; color:var(--text-muted); margin-top:1rem; text-align:center;">Note: Reviews are audited for quality and only allowed for verified customers.</p>
      </div>

    </section>

    <!-- Related Products -->
    <section style="margin-top: 5rem;">
      <h2 class="section-title" style="margin-bottom: 2rem;">Related Products</h2>
      <div class="grid-products" id="details-related-grid">
        <!-- Loaded dynamically via shop.js -->
        <div class="skeleton" style="height:350px;"></div>
        <div class="skeleton" style="height:350px;"></div>
      </div>
    </section>

  </main>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
