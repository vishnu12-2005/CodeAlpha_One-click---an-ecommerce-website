<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - OneClick</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header></header>

  <main class="container dashboard-layout" style="min-height: 75vh;">
    
    <div id="user-sidebar-container"></div>

    <div class="dashboard-content" style="display:grid; grid-template-columns:1fr 1fr; gap:2rem; align-items:start;">
      
      <!-- Profile Information Edit -->
      <div class="dashboard-card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;"><i class="fa-solid fa-user-pen"></i> Update Profile Information</h3>
        <form id="form-edit-profile">
          <div class="form-group">
            <label class="form-label" for="profile-name">Full Name</label>
            <input type="text" class="form-control" id="profile-name" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-phone">Phone Number</label>
            <input type="tel" class="form-control" id="profile-phone" autocomplete="tel" />
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-address">Shipping Address</label>
            <textarea class="form-control" id="profile-address" rows="4" autocomplete="street-address"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Save Profile Info</button>
        </form>
      </div>

      <!-- Password Edit -->
      <div class="dashboard-card">
        <h3 style="font-size: 1.25rem; margin-bottom: 1.5rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;"><i class="fa-solid fa-key"></i> Change Password</h3>
        <form id="form-edit-password">
          <div class="form-group">
            <label class="form-label" for="profile-curr-pass">Current Password</label>
            <input type="password" class="form-control" id="profile-curr-pass" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-new-pass">New Password (min 6 chars)</label>
            <input type="password" class="form-control" id="profile-new-pass" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-secondary" style="width:100%; margin-top:1rem; border-color:var(--primary); color:white;">Change Password</button>
        </form>
      </div>

    </div>

  </main>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
