<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create OneClick Account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header></header>

  <main class="auth-wrapper" style="padding: 2rem 0;">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <h2>Join OneClick</h2>
        <p>Create your customer account to start shopping.</p>
      </div>

      <form id="form-register">
        <div class="form-group">
          <label class="form-label" for="register-name">Full Name</label>
          <input type="text" class="form-control" id="register-name" placeholder="John Doe" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-email">Email Address</label>
          <input type="email" class="form-control" id="register-email" placeholder="john@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-password">Password (min 6 chars)</label>
          <input type="password" class="form-control" id="register-password" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-phone">Phone Number</label>
          <input type="tel" class="form-control" id="register-phone" placeholder="123-456-7890" autocomplete="tel" />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-address">Default Shipping Address</label>
          <textarea class="form-control" id="register-address" rows="3" placeholder="Street Address, City, ZIP Code" autocomplete="street-address"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/pages/login.html">Login</a></p>
      </div>
    </div>
  </main>

  <footer></footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
